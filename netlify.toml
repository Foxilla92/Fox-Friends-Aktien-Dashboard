[build]
  publish = "."
  functions = "netlify/functions"
  ignore = "node ./netlify-ignore-build.js"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


# Automatische Prüfung – Netlify-Zeitpläne laufen in UTC.
# Während der deutschen Sommerzeit:
# 07:15 UTC = 09:15 MESZ
# 13:45 UTC = 15:45 MESZ



# Marktfenster-Automatik:
# Netlify-Cron läuft in UTC. Das breite UTC-Fenster deckt Sommer- und Winterzeit ab.
# Die Funktion selbst startet eine Prüfung ausschließlich zwischen 15:30 und 22:00
# Europe/Berlin und ausschließlich auf :00/:15/:30/:45.
[functions."auto-refresh-market-window"]
  schedule = "*/15 13-21 * * 1-5"
